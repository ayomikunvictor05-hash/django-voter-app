{% extends 'base.html' %}
{% block title %}Login - VoterApp{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-4 offset-md-4">
        <div class="card shadow-sm p-4">
            <h3 class="text-center mb-3">Sign In</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <p class="text-center mt-3"><small>Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></small></p>
        </div>
    </div>
</div>
{% endblock %}
