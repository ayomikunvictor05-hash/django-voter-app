{% extends 'base.html' %}
{% block title %}Sign Up - VoterApp{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card shadow-sm p-4">
            <h3 class="text-center mb-3">Create an Account</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100">Register Account</button>
            </form>
            <p class="text-center mt-3"><small>Already registered? <a href="{% url 'login' %}">Sign In</a></small></p>
        </div>
    </div>
</div>
{% endblock %}
